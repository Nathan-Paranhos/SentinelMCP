name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Unit, Contract & Integration com PostgreSQL real)
    runs-on: ubuntu-latest

    env:
      # Os testes de PostgreSQL usam Testcontainers (Docker do runner). No CI, Docker ausente
      # deve FALHAR a execução em vez de ignorar os testes silenciosamente.
      SENTINEL_REQUIRE_DOCKER: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore Sentinel.sln

      - name: Build Solution
        run: dotnet build Sentinel.sln --no-restore -c Release -warnaserror

      - name: Run Unit Tests
        run: dotnet test tests/Sentinel.UnitTests/Sentinel.UnitTests.csproj --no-build -c Release --logger "console;verbosity=normal"

      - name: Run MCP Contract Tests
        run: dotnet test tests/Sentinel.ContractTests/Sentinel.ContractTests.csproj --no-build -c Release --logger "console;verbosity=normal"

      - name: Run Acceptance Criteria Integration Tests (InMemory + PostgreSQL)
        run: dotnet test tests/Sentinel.IntegrationTests/Sentinel.IntegrationTests.csproj --no-build -c Release --logger "console;verbosity=normal"
